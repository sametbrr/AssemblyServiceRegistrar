# Dependabot: weekly, grouped version updates (max 5 open PRs per ecosystem).
# Package ecosystems group minor and patch bumps into one PR; majors arrive one per PR.
# Security fixes arrive as one grouped "dependencies" PR. Majors listed under ignore are
# upgraded by hand (library compatibility floor, runtime-matched types, visual checks).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
      dependencies:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: ['version-update:semver-major']
