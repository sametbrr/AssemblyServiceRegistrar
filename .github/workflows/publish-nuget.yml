name: Publish NuGet

# Tag push (v*) ile tetiklenir. Tag, csproj'daki <Version> ile birebir aynı olmalı ve
# master üzerindeki bir commit'i göstermelidir; aksi halde publish yapılmaz.
# Örnek: csproj'da <Version>1.1.1</Version> → git tag v1.1.1 && git push origin v1.1.1
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # GitHub release
  id-token: write   # OIDC token for nuget.org trusted publishing

env:
  PROJECT: AssemblyServiceRegistrar/AssemblyServiceRegistrar.csproj

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check ref
        env:
          DEFAULT_BRANCH: master
        run: |
          COMMIT=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if ! git merge-base --is-ancestor "$COMMIT" "origin/$DEFAULT_BRANCH"; then
            echo "::error::tag $GITHUB_REF_NAME points to a commit that is not on $DEFAULT_BRANCH"; exit 1
          fi

      - name: Resolve version and check tag
        id: version
        run: |
          VERSION=$(sed -n 's:.*<Version>[[:space:]]*\([^<[:space:]]*\)[[:space:]]*</Version>.*:\1:p' "$PROJECT" | head -1)
          if [ -z "$VERSION" ]; then echo "::error::no <Version> in $PROJECT"; exit 1; fi
          TAG="v${VERSION}"
          if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match $PROJECT version $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build --configuration Release --no-restore -p:Version="$VERSION"

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet pack "$PROJECT"
          --configuration Release --no-build
          -p:Version="$VERSION"
          -o "$GITHUB_WORKSPACE/artifacts"

      # Trusted publishing: exchange the GitHub OIDC token for a 1-hour nuget.org API key.
      # nuget.org policy: owner sametbrr, repo AssemblyServiceRegistrar, workflow publish-nuget.yml, environment nuget.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: sametbrr

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "::error::NuGet login returned no API key (check the trusted publishing policy)"; exit 1; fi
          dotnet nuget push "$GITHUB_WORKSPACE/artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists."; exit 0; fi
          shopt -s nullglob
          gh release create "$TAG" "$GITHUB_WORKSPACE"/artifacts/*.nupkg "$GITHUB_WORKSPACE"/artifacts/*.snupkg \
            --title "$TAG" --generate-notes --verify-tag
